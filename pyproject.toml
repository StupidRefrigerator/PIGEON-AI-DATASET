[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urbangap"
version = "0.1.0"
description = "Reproducible Greater Sydney public toilet placement features"
requires-python = ">=3.14,<3.15"
dependencies = [
  "geopandas==1.2.0",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "shapely==2.2.0",
  "pyogrio==0.13.0",
  "pyproj==3.8.0",
  "h3==4.5.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
notebooks = ["jupyterlab==4.6.4", "ipykernel==7.4.0", "nbclient==0.11.0", "nbformat==5.11.1"]

[tool.setuptools.packages.find]
where = ["src"]
